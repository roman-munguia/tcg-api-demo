info:
  name: Chaos - retry passes
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/cards/search"
  headers:
    - name: X-Chaos-Fail-Times
      value: "1"
    - name: X-Chaos-Key
      value: "{{chaosKey}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: |-
