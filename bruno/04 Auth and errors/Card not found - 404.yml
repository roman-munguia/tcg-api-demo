info:
  name: Card not found - 404
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/cards?id={{missingCardId}}"
  params:
    - name: id
      value: "{{missingCardId}}"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.code
      operator: eq
      value: "NOT_FOUND"
