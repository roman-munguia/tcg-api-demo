info:
  name: Wrong password - 401
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{adminUsername}}",
        "password": "wrong-password"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.code
      operator: eq
      value: "INVALID_CREDENTIALS"
