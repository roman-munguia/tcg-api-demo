info:
  name: Get all decks
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/decks"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("an array with every deck", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array").with.length.at.least(6);
        });
