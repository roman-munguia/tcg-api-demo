info:
  name: Decks that use a card
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/decks/search?cardId={{cardId}}"
  params:
    - name: cardId
      value: "{{cardId}}"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.total
      operator: eq
      value: "2"

docs: |-
  Card 01 is in two seed decks: that is why deleting it returns 409 (see folder 04).
