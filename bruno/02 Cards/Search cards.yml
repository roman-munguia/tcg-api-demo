info:
  name: Search cards
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/cards/search?element=Lumen&sortBy=dropRate&order=desc"
  params:
    - name: element
      value: "Lumen"
      type: query
    - name: sortBy
      value: "dropRate"
      type: query
    - name: order
      value: "desc"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("5 Lumen cards, highest dropRate first", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.equal(200);
          expect(body.total).to.equal(5);
          const rates = body.items.map((c) => c.dropRate);
          expect(rates).to.deep.equal([...rates].sort((a, b) => b - a));
        });

docs: |-
  Filters, sorting and paging. Try `page`, `pageSize`, `type`, `minPoints` in the **Params** tab.
