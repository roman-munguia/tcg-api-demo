info:
  name: Reset seed data
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/reset"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.cards
      operator: eq
      value: "25"
    - expression: res.body.decks
      operator: eq
      value: "6"

docs: |-
  Admin only. Restores the demo data, so the counts in the next folders are predictable.
